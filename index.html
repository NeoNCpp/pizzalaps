<style>
:root{
  --red:#C8102E;--red-d:#9E0C24;--green:#1E7B3C;--green-d:#14592B;
  --bg:#FAF8F5;--ink:#1C1C1C;--muted:#6E6A66;--line:#ECE7E1;--soft:#F7F4F0;--pink:#FBE9EC;--mint:#E8F4EC;
  --r:18px;--shadow:0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;position:relative;min-height:100vh}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- LANDING ---------- */
.land{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px 60px;color:#fff;text-align:center;overflow:hidden;background:linear-gradient(165deg,#D81B36 0%,var(--red-d) 100%)}
.land::before{content:"";position:absolute;inset:-20px;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22140%22%20height%3D%22140%22%20viewBox%3D%220%200%20140%20140%22%3E%3Cg%20stroke%3D%22%23fff%22%20fill%3D%22none%22%3E%3Cg%20transform%3D%22translate%2832%2034%29%20rotate%2815%29%22%3E%3Ccircle%20r%3D%2214%22%20fill%3D%22none%22%20stroke-width%3D%222%22/%3E%3Ccircle%20r%3D%2210.8%22%20fill%3D%22none%22%20stroke-width%3D%221%22/%3E%3Cpath%20d%3D%22M0%20-10.8V10.8M-10.8%200H10.8%22%20stroke-width%3D%221%22/%3E%3Ccircle%20cx%3D%225.32%22%20cy%3D%22-5.32%22%20r%3D%222.3800000000000003%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%22-5.6000000000000005%22%20cy%3D%225.04%22%20r%3D%222.3800000000000003%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%22-5.04%22%20cy%3D%22-5.88%22%20r%3D%221.82%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%225.88%22%20cy%3D%225.6000000000000005%22%20r%3D%221.82%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28103%2030%29%20rotate%2825%29%20scale%281.05%29%22%3E%3Cpath%20d%3D%22M0%2012%20L-9%20-8%20Q0%20-13%209%20-8%20Z%22%20fill%3D%22none%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-7.3%20-4.6%20Q0%20-9%207.3%20-4.6%22%20fill%3D%22none%22%20stroke-width%3D%221%22/%3E%3Ccircle%20cx%3D%22-2.5%22%20cy%3D%22-1.5%22%20r%3D%222%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%222.6%22%20cy%3D%222.5%22%20r%3D%221.7%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2836%20104%29%20rotate%28-30%29%20scale%281.05%29%22%3E%3Cpath%20d%3D%22M0%2012%20L-9%20-8%20Q0%20-13%209%20-8%20Z%22%20fill%3D%22none%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-7.3%20-4.6%20Q0%20-9%207.3%20-4.6%22%20fill%3D%22none%22%20stroke-width%3D%221%22/%3E%3Ccircle%20cx%3D%22-2.5%22%20cy%3D%22-1.5%22%20r%3D%222%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%222.6%22%20cy%3D%222.5%22%20r%3D%221.7%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28104%20102%29%20rotate%28-20%29%22%3E%3Ccircle%20r%3D%2212%22%20fill%3D%22none%22%20stroke-width%3D%222%22/%3E%3Ccircle%20r%3D%228.8%22%20fill%3D%22none%22%20stroke-width%3D%221%22/%3E%3Cpath%20d%3D%22M0%20-8.8V8.8M-8.8%200H8.8%22%20stroke-width%3D%221%22/%3E%3Ccircle%20cx%3D%224.5600000000000005%22%20cy%3D%22-4.5600000000000005%22%20r%3D%222.04%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%22-4.800000000000001%22%20cy%3D%224.32%22%20r%3D%222.04%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%22-4.32%22%20cy%3D%22-5.04%22%20r%3D%221.56%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%225.04%22%20cy%3D%224.800000000000001%22%20r%3D%221.56%22%20fill%3D%22%23fff%22%20stroke%3D%22none%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");background-size:140px 140px;transform:rotate(-8deg)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%)}
.land-in{position:relative;width:100%;max-width:360px}
.logo{width:170px;height:170px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;border:6px solid #fff;
  box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 3px var(--green);background:#fff}
.land h1{font-family:Oswald,sans-serif;font-weight:700;font-size:38px;letter-spacing:2px;margin-top:20px;text-transform:uppercase}
.land p{opacity:.92;font-size:15px;margin-top:4px}
.lbtns{display:grid;gap:14px;margin-top:38px}
.lbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:16px;font-family:Oswald,sans-serif;font-weight:600;
  font-size:18px;letter-spacing:1.5px;color:#fff;background:var(--green);box-shadow:0 8px 20px rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.18);transition:transform .15s}
.lbtn.pri{background:#fff;color:var(--red);border-color:#fff}
.lbtn span{font-size:20px}
.lbtn:active{transform:scale(.97)}
.trk{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-family:Oswald,sans-serif;font-weight:600;font-size:13px;letter-spacing:.8px;white-space:nowrap;position:relative;flex:none}
.trk.lt{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2;background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.trk.dk{background:var(--pink);color:var(--red)}
.trk .dt{width:8px;height:8px;border-radius:50%;background:#2BD46A;box-shadow:0 0 0 0 rgba(43,212,106,.6);animation:dt 1.6s infinite}
@keyframes dt{70%{box-shadow:0 0 0 7px rgba(43,212,106,0)}}
.ol{display:grid;gap:8px;margin-top:12px}
.ol button{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;text-align:left}
.ol b{font-family:Oswald,sans-serif;font-size:18px;color:var(--red)}
.ol span{flex:1;font-size:13px;color:var(--muted)}
.adm-link{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.55);text-decoration:underline}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.back{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.topbar img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--green)}
.topbar h2{font-family:Oswald,sans-serif;font-size:22px;letter-spacing:1px;text-transform:uppercase;flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:#fff;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- CATEGORIES ---------- */
.sheet2{padding:18px 16px 110px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat{position:relative;aspect-ratio:1/1.05;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  justify-content:flex-end;padding:16px;text-align:left;color:#fff;transition:transform .18s ease}
.cat:active{transform:scale(.97)}
.cat:nth-child(4n+1),.cat:nth-child(4n+4){background:linear-gradient(150deg,#D81B36,var(--red-d))}
.cat:nth-child(4n+2),.cat:nth-child(4n+3){background:linear-gradient(150deg,#259148,var(--green-d))}
.cat .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.65))}
.cat .emo{position:absolute;top:12px;right:10px;font-size:58px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.cat .ring{position:absolute;width:150px;height:150px;border-radius:50%;border:18px solid rgba(255,255,255,.08);top:-40px;right:-50px}
.cat b{position:relative;font-family:Oswald,sans-serif;font-size:clamp(17px,5vw,24px);letter-spacing:.8px;overflow-wrap:anywhere;text-transform:uppercase;line-height:1}
.cat small{position:relative;font-size:12.5px;opacity:.9;margin-top:5px;display:flex;align-items:center;gap:6px}
.cat small::after{content:"→";font-size:14px}
.info{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;font-size:14px}
.info div{display:flex;gap:10px;align-items:center}
.info i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pink);flex:none}
.closed{margin-top:14px;background:#FFF6E0;border:1px solid #F3DFA8;color:#7A5A00;border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;text-align:center}
footer{text-align:center;font-size:12px;color:var(--muted);padding:18px 0 26px}

/* ---------- ITEMS ---------- */
.list{padding:16px 14px 110px;display:grid;gap:12px}
.item{display:flex;gap:14px;background:#fff;border-radius:var(--r);padding:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.03);cursor:pointer;transition:transform .15s}
.item:active{transform:scale(.98)}
.item .ph{width:96px;height:96px;border-radius:14px;flex:none;object-fit:cover;background:#F3EEE8;display:grid;place-items:center;font-size:40px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item h3{font-size:16px;font-weight:700;line-height:1.25}
.item p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4;flex:1}
.pr{font-family:Oswald,sans-serif;font-weight:600;font-size:18px;color:var(--red)}
.item .bot{display:flex;align-items:center;gap:10px;margin-top:8px}
.item .kc{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.item .add{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(30,123,60,.3)}
.item .more{margin-left:auto;font-size:12px;color:var(--green);font-weight:600}
.sz{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.sz div{background:var(--pink);border-radius:9px;padding:4px 2px;text-align:center;line-height:1.15}
.sz b{display:block;font-family:Oswald,sans-serif;font-size:12px;color:var(--green);letter-spacing:.5px}
.sz span{font-family:Oswald,sans-serif;font-weight:600;font-size:14px;color:var(--red)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:#fff;background:var(--green);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle;text-transform:uppercase}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}

/* ---------- CART BAR ---------- */
.cartbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:calc(100% - 28px);max-width:532px;z-index:60;
  display:flex;align-items:center;gap:12px;background:var(--green);color:#fff;border-radius:18px;padding:12px 14px 12px 16px;box-shadow:0 12px 30px rgba(20,89,43,.4);transition:transform .35s cubic-bezier(.22,.9,.3,1)}
.cartbar.on{transform:translate(-50%,0)}
.cartbar .cnt{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.cartbar .lbl{flex:1;font-weight:700;font-size:15px}
.cartbar .tot{font-family:Oswald,sans-serif;font-size:19px;font-weight:600}
.cartbar.bump{animation:bump .4s}
@keyframes bump{30%{transform:translate(-50%,0) scale(1.04)}}

/* ---------- SHEET / MODAL ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;transition:background .32s ease,visibility 0s linear .38s}
.modal.open{background:rgba(0,0,0,.5);visibility:visible;transition:background .32s ease,visibility 0s}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px 26px;max-height:92vh;overflow:auto;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.22,.9,.3,1);overscroll-behavior:contain}
.modal.open .box{transform:translateY(0)}
.modal .box.pd{padding:0}
.modal h3{font-family:Oswald,sans-serif;font-size:21px;letter-spacing:.5px;margin-bottom:4px}
.grab{position:sticky;top:0;height:0;z-index:3;display:flex;justify-content:center}
.grab::before{content:"";width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.85);margin-top:8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.grab.dk{position:static;height:auto;margin:-10px 0 10px}.grab.dk::before{background:#D9D4CE;box-shadow:none;margin-top:0}

.pd-img{position:relative;width:100%;aspect-ratio:16/11;background:linear-gradient(150deg,#D81B36,var(--red-d));display:grid;place-items:center;font-size:96px;overflow:hidden}
.pd-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pd-x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);font-size:18px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:2}
.pd-b{padding:18px 18px 8px}
.pd-h{display:flex;align-items:flex-start;gap:12px}
.pd-h h3{flex:1;font-family:Inter,sans-serif;font-weight:800;font-size:21px;letter-spacing:0;line-height:1.25}
.pd-h .pr{font-size:22px;white-space:nowrap}
.pd-desc{font-size:14.5px;color:#4a4744;line-height:1.55;margin-top:8px}
.pd-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pd-stat{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.pd-stat i{font-style:normal;font-size:22px;grid-row:span 2}
.pd-stat b{display:block;font-size:14.5px;line-height:1.2}
.pd-stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pd-sec{margin-top:18px}
.pd-sec h5{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pd-sz{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pd-sz button{border:2px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;background:#fff;transition:.15s}
.pd-sz button.on{border-color:var(--green);background:var(--mint);box-shadow:0 0 0 2px rgba(30,123,60,.15)}
.pd-sz b{display:block;font-family:Oswald,sans-serif;font-size:20px;color:var(--green);line-height:1}
.pd-sz span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.pd-sz em{display:block;font-style:normal;font-family:Oswald,sans-serif;font-weight:600;font-size:17px;color:var(--red);margin-top:5px}
.alg{display:flex;flex-wrap:wrap;gap:6px}
.alg span{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--pink);color:var(--red-d)}
.alg.none span{background:var(--mint);color:var(--green-d)}
.pd-note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
.pd-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
.qty{display:flex;align-items:center;background:var(--soft);border-radius:14px;flex:none}
.qty button{width:42px;height:46px;font-size:22px;font-weight:700;color:var(--green)}
.qty b{min-width:26px;text-align:center;font-size:17px}
.qty.sm button{width:32px;height:34px;font-size:18px}.qty.sm b{min-width:20px;font-size:15px}
.addbtn{flex:1;height:50px;border-radius:14px;background:var(--green);color:#fff;font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}

/* cart sheet */
.cl{display:grid;gap:10px;margin-top:14px}
.cli{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px}
.cli .th{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#F3EEE8;display:grid;place-items:center;font-size:24px;flex:none}
.cli .nm{flex:1;min-width:0}
.cli .nm b{display:block;font-size:14.5px;line-height:1.25}
.cli .nm span{font-size:12.5px;color:var(--muted)}
.cli .nm .pr{font-size:15px;display:block;margin-top:2px}
.sumrow{display:flex;justify-content:space-between;font-size:14.5px;padding:5px 0}
.sumrow.tot{font-weight:800;font-size:17px;border-top:1.5px dashed var(--line);margin-top:6px;padding-top:12px}
.sumrow.disc{color:var(--green);font-weight:600}
.bigbtn{width:100%;height:54px;border-radius:15px;background:var(--red);color:#fff;font-weight:800;font-size:16px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px rgba(200,16,46,.25)}
.bigbtn.g{background:var(--green);box-shadow:0 8px 20px rgba(30,123,60,.25)}
.bigbtn:disabled{opacity:.5;box-shadow:none}

/* ---------- CHECKOUT ---------- */
.co{padding:14px 14px 140px;display:grid;gap:12px}
.cocard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cocard h4{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;margin-bottom:4px}
.cocard h4 i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:15px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:11px 0 5px}
.fl em{color:var(--red);font-style:normal}
.in{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px;outline:none;color:var(--ink)}
.in:focus{border-color:var(--green)}
.in.bad{border-color:var(--red);background:#FFF7F8}
textarea.in{resize:vertical;min-height:72px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.locbtn{margin-top:12px;width:100%;padding:12px;border-radius:11px;border:1.5px dashed var(--green);color:var(--green);font-weight:700;font-size:14px;background:var(--mint)}
.locbtn.ok{border-style:solid}
.pay{display:grid;gap:8px;margin-top:10px}
.pay label{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid var(--line);border-radius:13px;font-weight:600;font-size:14.5px;cursor:pointer}
.pay label:has(input:checked){border-color:var(--green);background:var(--mint)}
.pay input{width:19px;height:19px;accent-color:var(--green)}
.pay small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.paynote{display:flex;gap:10px;align-items:center;background:#FFF6E0;color:#7A5A00;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:10px}
.cpn{display:flex;gap:8px;margin-top:10px}
.cpn .in{text-transform:uppercase;letter-spacing:1px;font-weight:700}
.cpn button{padding:0 18px;border-radius:11px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;flex:none}
.cpn-ok{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--mint);color:var(--green-d);border-radius:12px;padding:11px 13px;font-weight:700;font-size:14px}
.cpn-ok button{margin-left:auto;font-size:13px;text-decoration:underline;color:var(--green-d)}
.mini{display:grid;gap:6px;margin-top:8px}
.mini div{display:flex;gap:8px;font-size:14px}
.mini div b{color:var(--green);min-width:26px}
.mini div span{flex:1}
.mini div em{font-style:normal;font-weight:700}
.cofoot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(14px + env(safe-area-inset-bottom));z-index:50}
.cofoot .bigbtn{margin:0}
.warn{font-size:12.5px;color:var(--red);text-align:center;margin-bottom:8px;font-weight:600}

/* ---------- DONE ---------- */
.done{padding:30px 18px 60px;text-align:center}
.done .ok{width:92px;height:92px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:46px;margin:10px auto 16px;box-shadow:0 0 0 10px var(--mint);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h2{font-family:Oswald,sans-serif;font-size:26px;letter-spacing:.5px}
.done .no{display:inline-block;margin-top:8px;font-family:Oswald,sans-serif;font-size:20px;background:var(--pink);color:var(--red);padding:6px 16px;border-radius:999px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 8px;position:relative}
.steps::before{content:"";position:absolute;top:17px;left:12.5%;right:12.5%;height:3px;background:var(--line)}
.steps .st{position:relative;font-size:11.5px;color:var(--muted);font-weight:600}
.steps .st i{font-style:normal;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;margin:0 auto 6px;font-size:15px}
.steps .st.on{color:var(--green)}
.steps .st.on i{border-color:var(--green);background:var(--green);color:#fff}
.steps .st.cur i{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(30,123,60,.15)}}
.cancelled{background:var(--pink);color:var(--red-d);border-radius:14px;padding:14px;font-weight:700;margin-top:20px}

/* ---------- AUTH ---------- */
.pin{position:fixed;inset:0;z-index:300;background:rgba(20,20,20,.75);display:none;align-items:center;justify-content:center;padding:20px}
.pin.open{display:flex}
.pin .box{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:340px;text-align:center}
.pin .box img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--red)}
.pin .box h3{font-family:Oswald,sans-serif;margin:10px 0 14px;font-size:20px}
.pin .in{text-align:center;margin-bottom:8px}
.pin .in.pw{font-size:22px;letter-spacing:8px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(160px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:400;transition:.25s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- ADMIN ---------- */
.adm{position:fixed;inset:0;z-index:100;background:#F4F2EF;overflow:auto;display:none}
.adm.open{display:block}
.adm-h{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.adm-h b{font-family:Oswald,sans-serif;font-size:19px;letter-spacing:1px;flex:1}
.adm-h button{background:rgba(255,255,255,.12);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:4;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;padding:13px 10px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--red);border-color:var(--red)}
.pane{padding:16px;display:none;max-width:720px;margin:0 auto}
.pane.on{display:block}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h4{font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.btn{padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--red);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.g{background:var(--green)}.btn.d{background:var(--ink)}.btn.o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.ali{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ali .th{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#F3EEE8;display:grid;place-items:center;font-size:24px;flex:none}
.ali .nm{flex:1;min-width:0}
.ali .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ali .nm span{font-size:12.5px;color:var(--muted)}
.ali .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#F4F2EF;font-size:15px;flex:none}
.ali.off{opacity:.5}
.ali .code{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:1px;background:var(--mint);color:var(--green-d);padding:8px 10px;border-radius:9px;font-size:14px;flex:none}
.imgpick{display:flex;align-items:center;gap:10px}
.imgpick img,.imgpick .noimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#F3EEE8;display:grid;place-items:center;color:var(--muted);font-size:11px}
.lg-prev{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--green)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:8px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px}
.sw input{width:18px;height:18px;accent-color:var(--green)}
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.ckgrid label{display:flex;align-items:center;gap:7px;font-size:13.5px}
.ckgrid input{width:17px;height:17px;accent-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
pre.code{background:#1C1C1C;color:#E8E8E8;border-radius:10px;padding:12px;font-size:11.5px;overflow:auto;line-height:1.45;margin-top:8px;max-height:260px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.ok{background:var(--mint);color:var(--green-d)}.badge.no{background:#FFF6E0;color:#7A5A00}
ol.stepsl{padding-left:18px;font-size:13px;line-height:1.7;color:#3b3936;margin-top:6px}
.localbar{background:#FFF6E0;color:#7A5A00;font-size:12.5px;font-weight:600;padding:9px 14px;text-align:center}

/* ---------- KITCHEN ---------- */
.kt{min-height:100vh;background:#121212;color:#EDEDED;font-family:Inter,system-ui,sans-serif}
.kt-h{position:sticky;top:0;z-index:10;background:#1A1A1A;border-bottom:1px solid #2A2A2A;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kt-h img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--red)}
.kt-h .ttl{font-family:Oswald,sans-serif;font-size:21px;letter-spacing:2px}
.kt-h .ttl small{display:block;font-family:Inter;font-size:11.5px;letter-spacing:0;color:#9A9A9A;font-weight:500}
.kt-h .clock{font-family:Oswald,sans-serif;font-size:22px;color:#fff;margin-left:auto}
.kt-h .kb{background:#2A2A2A;color:#EDEDED;padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600}
.kt-h .kb.on{background:var(--green)}
.kt-stats{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
.kt-stats div{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:12px;padding:8px 14px;font-size:12.5px;color:#9A9A9A}
.kt-stats b{display:block;font-family:Oswald,sans-serif;font-size:22px;color:#fff;font-weight:600}
.kt-stats .n b{color:#FF4D67}.kt-stats .p b{color:#FFB547}.kt-stats .w b{color:#4FC3F7}.kt-stats .d b{color:#5BD08A}
.kt-tabs{display:flex;gap:8px;padding:12px 16px}
.kt-tabs button{padding:9px 16px;border-radius:999px;background:#1E1E1E;border:1px solid #2A2A2A;font-weight:700;font-size:13px;color:#BDBDBD}
.kt-tabs button.on{background:#fff;color:#121212}
.kt-board{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:14px;padding:0 16px 30px;align-items:start}
.kt-col h3{font-family:Oswald,sans-serif;font-size:15px;letter-spacing:1.5px;color:#9A9A9A;margin:4px 2px 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.kt-col h3 span{background:#2A2A2A;color:#fff;border-radius:999px;padding:1px 9px;font-size:13px}
.kt-col .dot{width:10px;height:10px;border-radius:50%}
.kt-list{display:grid;gap:12px}
.kt-empty{border:1.5px dashed #2E2E2E;border-radius:14px;padding:24px;text-align:center;color:#6A6A6A;font-size:13px}
.oc{background:#1E1E1E;border:1px solid #2C2C2C;border-left:5px solid #555;border-radius:14px;overflow:hidden}
.oc.new{border-left-color:#FF4D67;animation:glow 1.6s infinite}

.oc-pay{display:inline-block;margin-top:6px;background:#2F5E3E;color:#BFF0CF;font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:8px}

.k2{background:#1C1C1C;border:1px solid #2E2E2E;border-top:4px solid #555;border-radius:10px;overflow:hidden;color:#F2F2F2}
.k2.new{border-top-color:#FF4D67;animation:glow 1.6s infinite}.k2.preparing{border-top-color:#FFB547}.k2.onway{border-top-color:#4FC3F7}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
const arr = v => Array.isArray(v) ? v.filter(x => x != null) : (v ? Object.values(v) : []);
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? 0 : n; };
const money = n => { const v = Number(n); return isNaN(v) ? esc(n) : '₺' + v.toLocaleString('tr-TR',{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2}); };
const MEM = {};
const LSget = k => { try{ return localStorage.getItem(k); }catch(e){ return MEM[k] ?? null; } };
const LSset = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){ MEM[k] = v; } };
const LSdel = k => { try{ localStorage.removeItem(k); }catch(e){ delete MEM[k]; } };
const LSjson = (k,d) => { try{ return JSON.parse(LSget(k)) ?? d; }catch(e){ return d; } };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1300); }
const LS_DRAFT='qrmenu_draft_v1', LS_CART='qr_cart', LS_CUST='qr_cust', LS_LAST='qr_active', LS_ORD='qr_orders_local', LS_KOK='qr_kitchen_ok';

const SIZES = [['S','Küçük'],['M','Orta'],['L','Büyük'],['XL','Jumbo']];
const hasSizes = i => !!i.sizes && SIZES.some(s => i.sizes[s[0]] !== '' && i.sizes[s[0]] != null);
const sizeList = i => SIZES.filter(s => i.sizes && i.sizes[s[0]] !== '' && i.sizes[s[0]] != null).map(s => [s[0], s[1], i.sizes[s[0]]]);
const minPrice = i => hasSizes(i) ? Math.min(...sizeList(i).map(s => num(s[2]))) : num(i.price);
const maxPrice = i => Math.max(...sizeList(i).map(s => num(s[2])));
const unitPrice = (i,size) => size ? num(i.sizes?.[size]) : num(i.price);
const ALLERGENS = [['gluten','Gluten','🌾'],['sut','Süt','🥛'],['yumurta','Yumurta','🥚'],['soya','Soya','🫘'],['yerfistigi','Yer fıstığı','🥜'],['kabuklu','Sert kabuklu meyve','🌰'],['susam','Susam','⚪'],['hardal','Hardal','🟡'],['kereviz','Kereviz','🥬'],['balik','Balık','🐟'],['kabuklular','Kabuklu deniz ürünü','🦐'],['yumusakca','Yumuşakça','🦑'],['sulfit','Sülfit','🍷'],['lupin','Acı bakla','🫛']];
const STATUS = {new:['Yeni','🔔'], preparing:['Hazırlanıyor','👨‍🍳'], onway:['Yolda','🛵'], done:['Teslim Edildi','✅'], cancelled:['İptal','✕']};

  /* yerel mod: panelde yapılan taslak yalnızca aynı dosya sürümünden türetildiyse kullanılır */

function normalize(){

    pin:'1234',kpin:'0000',orderOn:true,minOrder:0,deliveryFee:0,logo:''}, D.biz || {});

let db = null, auth = null, FBOK = false;
const loadScript = src => new Promise((res,rej) => { const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Firebase kütüphanesi yüklenemedi')); document.head.appendChild(s); });
async function initFB(){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-database-compat.js'), loadScript(base+'firebase-auth-compat.js')]);
  firebase.initializeApp(FBC); db = firebase.database(); auth = firebase.auth(); FBOK = true;
}
let bc = null; try{ bc = new BroadcastChannel('qr_orders'); }catch(e){}
const LocalOrders = {
  all(){ return LSjson(LS_ORD, []); },
  put(list){ LSset(LS_ORD, JSON.stringify(list)); if(bc) bc.postMessage('x'); localTick(); }
};
const localSubs = new Set();
function localTick(){ localSubs.forEach(f => f()); }
if(bc) bc.onmessage = localTick;
addEventListener('storage', e => { if(e.key === LS_ORD) localTick(); });

const Store = {
  async coupon(code){
    if(FBC && !FBOK) throw new Error('Sunucuya bağlanılamadı');
    if(FBOK){ const s = await db.ref('coupons/'+code).get(); return s.val(); }
    return D.coupons.find(c => c.code === code) || null;
  },
  async placeOrder(o){
    if(FBC && !FBOK) throw new Error('Sunucuya bağlanılamadı, internet bağlantınızı kontrol edin');
    if(FBOK){
      const r = await db.ref('meta/orderNo').transaction(v => (v || 0) + 1);
      o.no = r.snapshot.val();
      const ref = db.ref('orders').push(); o.id = ref.key;
      await ref.set(Object.assign({}, o, {createdAt: firebase.database.ServerValue.TIMESTAMP}));
      return o;
    }
    const list = LocalOrders.all();
    o.no = list.reduce((m,x) => Math.max(m, x.no||0), 0) + 1; o.id = uid();
    list.push(o); LocalOrders.put(list); return o;
  },
  watchOrders(cb){
    if(FBC && !FBOK){ toast('Sunucuya bağlanılamadı — sayfayı yenileyin'); cb([]); return; }
    if(FBOK){ db.ref('orders').orderByChild('createdAt').limitToLast(400).on('value', s => cb(Object.values(s.val() || {})), e => toast('Sipariş okuma hatası: ' + e.message)); return; }
    const f = () => cb(LocalOrders.all()); localSubs.add(f); f(); setInterval(f, 5000);
  },
  watchOrder(id, cb){
    if(FBC && !FBOK){ cb(null); return () => {}; }
    if(FBOK){ const r = db.ref('orders/'+id); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); }
    const f = () => cb(LocalOrders.all().find(o => o.id === id) || null); localSubs.add(f); f(); return () => localSubs.delete(f);
  },
  async remove(ids){
    if(FBC && !FBOK) throw new Error('Sunucuya bağlanılamadı');
    if(FBOK){ const u = {}; ids.forEach(id => u['orders/' + id] = null); await db.ref().update(u); return; }
    LocalOrders.put(LocalOrders.all().filter(o => !ids.includes(o.id)));
  },
  async setStatus(id, st){
    if(FBOK){ await db.ref('orders/'+id).update({status: st, ['t_'+st]: firebase.database.ServerValue.TIMESTAMP}); return; }
    const list = LocalOrders.all(); const o = list.find(x => x.id === id); if(o){ o.status = st; o['t_'+st] = Date.now(); LocalOrders.put(list); }
  }
};

let saveT;
function save(){
  if(FBC){ clearTimeout(saveT); saveT = setTimeout(pushMenu, 500); return; }
  try{ localStorage.setItem(LS_DRAFT, JSON.stringify(D)); }catch(e){ MEM[LS_DRAFT] = JSON.stringify(D); }
}
async function pushMenu(){
  if(!FBOK || !auth.currentUser){ toast('Sunucuya kaydetmek için giriş yapın'); return; }
  const m = clone(D); delete m.coupons; delete m.biz.fb; delete m.biz.pin; delete m.biz.kpin;
  const c = {}; D.coupons.forEach(x => c[x.code] = x);
  try{ await db.ref().update({menu: m, coupons: c}); }catch(e){ toast('Sunucu kayıt hatası: ' + e.message); }
}

/* ================= SEPET ================= */
let cart = LSjson(LS_CART, []);
let coupon = null;
function saveCart(){ LSset(LS_CART, JSON.stringify(cart)); updateCartBar(); }
function cartLines(){
  return cart.map(l => {
    const it = D.items.find(x => x.id === l.id); if(!it || it.on === false) return null;
    if(l.size && !(hasSizes(it) && sizeList(it).some(s => s[0] === l.size))) return null;
    if(!l.size && hasSizes(it)) return null;
    return Object.assign({}, l, {it, unit: unitPrice(it, l.size), sizeName: l.size ? (SIZES.find(s => s[0] === l.size) || [])[1] : ''});
  }).filter(Boolean);
}
const cartCount = () => cartLines().reduce((s,l) => s + l.qty, 0);
const cartSub = () => cartLines().reduce((s,l) => s + l.unit * l.qty, 0);
function cartAdd(id, size, qty){
  const key = id + '|' + (size || ''); const l = cart.find(x => x.key === key);
  if(l) l.qty += qty; else cart.push({key, id, size: size || '', qty});
  saveCart(); const b = $('#cartbar'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
}
function cartQty(key, d){
  const l = cart.find(x => x.key === key); if(!l) return;
  l.qty += d; if(l.qty <= 0) cart = cart.filter(x => x.key !== key); saveCart();
}
function couponDiscount(sub){
  if(!coupon) return 0;
  const v = num(coupon.value);
  const d = coupon.type === 'pct' ? sub * v / 100 : v;
  return Math.min(sub, Math.round(d * 100) / 100);
}
function couponProblem(c, sub){
  if(!c || c.on === false) return 'Geçersiz kupon kodu';
  if(c.until){ const end = new Date(c.until + 'T23:59:59'); if(Date.now() > end) return 'Bu kuponun süresi dolmuş'; }
  if(num(c.min) && sub < num(c.min)) return `Bu kupon ${money(c.min)} ve üzeri siparişlerde geçerli`;
  return '';
}
const ordering = () => D.biz.orderOn !== false;
function updateCartBar(){
  const n = cartCount(), show = ordering() && n > 0 && (view.page === 'home' || view.page === 'cat') && !KITCHEN;
  $('#cbCnt').textContent = n; $('#cbTot').textContent = money(cartSub());
  $('#cartbar').classList.toggle('on', show);
}

/* ---- aktif siparişler (takip) ---- */
const actives = () => LSjson(LS_LAST, []).filter(a => a && a.id && Date.now() - a.t < 24*3600e3);
function addActive(o){ const l = actives().filter(a => a.id !== o.id); l.push({id:o.id, no:o.no, t:Date.now()}); LSset(LS_LAST, JSON.stringify(l)); }
function removeActive(id){ LSset(LS_LAST, JSON.stringify(actives().filter(a => a.id !== id))); }
const trkBtn = cls => `<button class="trk ${cls}" onclick="openTrack()">${actives().length ? '<i class="dt"></i>' : '📦'} SİPARİŞ TAKİP</button>`;
function openTrack(){
  const l = actives();
  if(!l.length) return toast('Aktif siparişiniz bulunmuyor');
  if(l.length === 1) return go({page:'done', id:l[0].id});
  $('#mbox').classList.remove('pd');
  openModal(`<div class="grab dk"></div><h3>Siparişlerim</h3><div class="ol">${l.slice().reverse().map(a => `<button onclick="closeModal();go({page:'done',id:'${esc(a.id)}'})"><b>#${esc(a.no)}</b><span>${new Date(a.t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} siparişi</span>›</button>`).join('')}</div>`);
}
/* açılışta teslim edilmiş / iptal siparişleri takipten düşür */
function pruneActives(){
  actives().forEach(a => { let off = null; off = Store.watchOrder(a.id, o => {
    if(!o || o.status === 'done' || o.status === 'cancelled'){ removeActive(a.id); if(!KITCHEN && view.page !== 'done') render(); }
    setTimeout(() => off && off(), 0);
  }); });
}

/* ================= GEZİNME ================= */
let view = {page:'landing'};
let HIST = true; const STACK = [];
function hpush(v){ if(!HIST) return; try{ history.pushState(v,''); }catch(e){ HIST = false; } }
function go(v){ STACK.push(view); view = v; hpush(v); render(); scrollTo(0,0); }
function goBack(){
  if(HIST && STACK.length){ history.back(); return; }
  view = STACK.pop() || (view.page === 'cat' ? {page:'home'} : view.page === 'checkout' ? {page:'home'} : {page:'landing'}); render(); scrollTo(0,0);
}
addEventListener('popstate', e => { if(KITCHEN) return; STACK.pop(); view = e.state || {page:'landing'}; closeModal(); render(); scrollTo(0,0); });
function openMenu(){ go({page:'home'}); }
function openCat(id){
  if(view.page === 'cat'){ view = {page:'cat', cat:id}; if(HIST) try{ history.replaceState(view,''); }catch(e){ HIST = false; } render(); scrollTo(0,0); }
  else go({page:'cat', cat:id});
}

/* telefon: 0 ile başlıyorsa 11 hane, 0 olmadan 10 hane */
const phoneDigits = v => String(v || '').replace(/\D/g, '');
function phoneProblem(v){
  const d = phoneDigits(v);
  if(!d) return 'Telefon numarası gerekli';
  if(d[0] === '0') return d.length === 11 ? '' : 'Başında 0 varsa numara 11 haneli olmalı';
  return d.length === 10 ? '' : 'Başında 0 yoksa numara 10 haneli olmalı';
}
function phoneInput(el){
  const d = phoneDigits(el.value).slice(0, phoneDigits(el.value)[0] === '0' ? 11 : 10);
  if(el.value !== d) el.value = d;
  cust.phone = d; el.classList.remove('bad');
  const p = phoneProblem(d), m = $('#phMsg');
  if(m){ m.textContent = d.length && p ? p : ''; }
}

function drawCoupon(){
  const box = $('#cpnBox'); if(!box) return;
  box.innerHTML = coupon
    ? `<div class="cpn-ok">✓ ${esc(coupon.code)} · ${coupon.type==='pct' ? '%' + esc(coupon.value) : money(coupon.value)} indirim<button onclick="coupon=null;drawCoupon();drawSum()">Kaldır</button></div>`
    : `<div class="cpn"><input class="in" id="cpnIn" placeholder="KUPON KODU" maxlength="20" onkeydown="if(event.key==='Enter')applyCoupon()"><button onclick="applyCoupon()">Uygula</button></div>`;
}
async function applyCoupon(){
  const code = ($('#cpnIn').value || '').trim().toUpperCase(); if(!code) return;
  if(!/^[A-Z0-9_-]{2,20}$/.test(code)) return toast('Geçersiz kupon kodu');
  let c = null; try{ c = await Store.coupon(code); }catch(e){ return toast('Kupon kontrol edilemedi'); }
  const p = couponProblem(c, cartSub()); if(p) return toast(p);
  coupon = c; drawCoupon(); drawSum(); toast('Kupon uygulandı');
}
function totals(){
  const sub = cartSub();
  if(coupon && couponProblem(coupon, sub)) coupon = null;
  const disc = couponDiscount(sub), fee = num(D.biz.deliveryFee);
  return {sub, disc, fee, total: Math.max(0, sub - disc + fee)};
}
function drawSum(){
  const t = totals(), min = num(D.biz.minOrder);
  $('#sumBox').innerHTML = `
    <div class="sumrow"><span>Ara Toplam</span><span>${money(t.sub)}</span></div>
    ${t.disc ? `<div class="sumrow disc"><span>Kupon (${esc(coupon.code)})</span><span>−${money(t.disc)}</span></div>` : ''}
    <div class="sumrow"><span>Teslimat Ücreti</span><span>${t.fee ? money(t.fee) : 'Ücretsiz'}</span></div>
    <div class="sumrow tot"><span>Toplam</span><span>${money(t.total)}</span></div>`;
  const low = min && t.sub < min;
  $('#coFoot').innerHTML = `${low ? `<p class="warn">Minimum sipariş tutarı ${money(min)}</p>` : ''}
    <button class="bigbtn g" id="sendBtn" ${low ? 'disabled' : ''} onclick="submitOrder()">Siparişi Onayla · ${money(t.total)}</button>`;
}
function getLoc(){
  if(!navigator.geolocation) return toast('Cihazınız konum paylaşımını desteklemiyor');
  const b = $('#locBtn'); b.textContent = 'Konum alınıyor…';
  navigator.geolocation.getCurrentPosition(p => {
    cust.lat = +p.coords.latitude.toFixed(6); cust.lng = +p.coords.longitude.toFixed(6);
    b.textContent = '✓ Konumunuz eklendi'; b.classList.add('ok');
  }, () => { b.textContent = '📍 Konumumu Ekle (kurye için)'; toast('Konum alınamadı, izin verdiğinizden emin olun'); }, {enableHighAccuracy:true, timeout:12000});
}
let sending = false;
async function submitOrder(){
  if(sending) return;
  const req = [['ad', v => v.trim().length >= 2], ['soyad', v => v.trim().length >= 2], ['phone', v => !phoneProblem(v)], ['mahalle', v => v.trim()], ['bina', v => v.trim()]];
  let bad = null;
  req.forEach(([k, ok]) => { const el = $('#c-'+k); if(!ok(cust[k] || '')){ el.classList.add('bad'); bad = bad || el; } });
  if(!cust.cadde.trim() && !cust.sokak.trim()){ $('#c-cadde').classList.add('bad'); $('#c-sokak').classList.add('bad'); bad = bad || $('#c-cadde'); }
  if(bad){ bad.scrollIntoView({behavior:'smooth', block:'center'}); return toast(bad.id === 'c-phone' ? phoneProblem(cust.phone) : 'Lütfen işaretli alanları doldurun'); }
  if(!ordering()) return toast('Şu anda sipariş alınmıyor');
  const L = cartLines(); if(!L.length) return;
  if(coupon){ try{ const c = await Store.coupon(coupon.code); const p = couponProblem(c, cartSub()); if(p){ coupon = null; drawCoupon(); drawSum(); return toast(p); } coupon = c; }catch(e){} }
  const t = totals();
  const o = {
    status: 'new', createdAt: Date.now(),
    items: L.map(l => ({id: l.id, name: l.it.name, size: l.size, sizeName: l.sizeName, qty: l.qty, unit: l.unit, line: l.unit * l.qty})),
    subtotal: t.sub, discount: t.disc, coupon: coupon ? coupon.code : '', deliveryFee: t.fee, total: t.total,
    customer: {name: (cust.ad.trim() + ' ' + cust.soyad.trim()).trim(), ad: cust.ad.trim(), soyad: cust.soyad.trim(), phone: phoneDigits(cust.phone)},
    address: {mahalle: cust.mahalle.trim(), cadde: cust.cadde.trim(), sokak: cust.sokak.trim(), bina: cust.bina.trim(), kat: cust.kat.trim(), daire: cust.daire.trim(), tarif: cust.tarif.trim(), lat: cust.lat, lng: cust.lng},
    payment: 'Kapıda ' + cust.pay, note: cust.note.trim()
  };
  sending = true; const btn = $('#sendBtn'); btn.disabled = true; btn.textContent = 'Gönderiliyor…';
  try{
    const r = await Store.placeOrder(o);
    const keep = Object.assign({}, cust); delete keep.note; delete keep.lat; delete keep.lng; LSset(LS_CUST, JSON.stringify(keep));
    addActive(r);
    cart = []; coupon = null; cust.note = ''; saveCart();
    STACK.length = 0; view = {page:'done', id: r.id, fresh: true}; try{ history.replaceState(view,''); }catch(e){}
    render(); scrollTo(0,0);
  }catch(e){
    toast('Sipariş gönderilemedi: ' + (e.message || 'bağlantı hatası')); btn.disabled = false; drawSum();
  }
  sending = false;
}

let stopTrack = null;
function renderDone(app){
  app.innerHTML = `<div class="topbar"><div class="row"><button class="back" onclick="STACK.length=0;view={page:'landing'};render()">‹</button><h2>Siparişim</h2><img src="${D.biz.logo}" alt=""></div></div><div class="done fade" id="doneBox"><div class="empty">Yükleniyor…</div></div>`;
  if(stopTrack) stopTrack();
  stopTrack = Store.watchOrder(view.id, o => {
    const box = $('#doneBox'); if(!box) return;
    if(!o){ box.innerHTML = `<div class="empty">Sipariş bulunamadı.</div>`; return; }
    const order = ['new','preparing','onway','done'], idx = order.indexOf(o.status);
    const fin = o.status === 'done' || o.status === 'cancelled';
    if(fin) removeActive(o.id);
    box.innerHTML = `
      <div class="ok" ${o.status==='cancelled'?'style="background:var(--red);box-shadow:0 0 0 8px var(--pink)"':''}>${o.status==='cancelled'?'✕':'✓'}</div>
      <h2>${o.status === 'done' ? 'Siparişiniz teslim edildi' : o.status === 'cancelled' ? 'Sipariş iptal edildi' : 'Siparişiniz alındı'}</h2>
      ${o.status === 'done' ? `<p style="color:var(--muted);font-size:13.5px;margin-top:6px">Afiyet olsun! Siparişiniz tamamlandı ve takipten kaldırıldı.</p>` : ''}
      <div class="no">Sipariş No #${esc(o.no)}</div>
      ${o.status === 'cancelled' ? `<div class="cancelled">Siparişiniz iptal edildi. Bilgi için ${D.biz.phone ? `<a href="tel:${esc(D.biz.phone.replace(/\s/g,''))}">${esc(D.biz.phone)}</a>` : 'işletmeyi'} arayabilirsiniz.</div>` : `
      <div class="steps">${order.map((s,k) => `<div class="st ${k<=idx?'on':''} ${k===idx&&s!=='done'?'cur':''}"><i>${k<idx||s==='done'&&idx===3?'✓':STATUS[s][1]}</i>${s==='new'?'Alındı':STATUS[s][0]}</div>`).join('')}</div>`}
      <div class="cocard" style="text-align:left;margin-top:22px">
        <div class="mini">${arr(o.items).map(l => `<div><b>${l.qty}×</b><span>${esc(l.name)}${l.size ? ` <small style="color:var(--muted)">(${esc(l.size)})</small>` : ''}</span><em>${money(l.line)}</em></div>`).join('')}</div>
        <div style="margin-top:10px">
          ${o.discount ? `<div class="sumrow disc"><span>Kupon (${esc(o.coupon)})</span><span>−${money(o.discount)}</span></div>` : ''}
          ${o.deliveryFee ? `<div class="sumrow"><span>Teslimat</span><span>${money(o.deliveryFee)}</span></div>` : ''}
          <div class="sumrow tot"><span>Toplam · ${esc(o.payment)}</span><span>${money(o.total)}</span></div>
        </div>
      </div>
      <button class="bigbtn" onclick="STACK.length=0;view={page:'landing'};render()">Ana Sayfaya Dön</button>`;
  });
}

function editCpn(code){
  const c = code ? D.coupons.find(x => x.code === code) : {code:'', type:'pct', value:'', min:'', until:'', on:true};
  $('#mbox').classList.remove('pd');
  openModal(`<div class="grab dk"></div>

      <div><label class="l">İndirim değeri</label><input class="in" id="k-val" type="number" step="0.01" inputmode="decimal" value="${esc(c.value)}"></div>
    </div>

      <div><label class="l">Min. sepet tutarı (₺)</label><input class="in" id="k-min" type="number" inputmode="decimal" value="${esc(c.min)}" placeholder="0"></div>
      <div><label class="l">Son geçerlilik tarihi</label><input class="in" id="k-until" type="date" value="${esc(c.until)}"></div>
    </div>
    <div class="sw"><input type="checkbox" id="k-on" ${c.on!==false?'checked':''}> Aktif</div>
    <div class="acts"><button class="btn g" id="k-save">Kaydet</button><button class="btn o" onclick="closeModal()">Vazgeç</button>${code ? `<button class="btn" style="margin-left:auto" id="k-del">Sil</button>` : ''}</div>`);
  $('#k-save').onclick = () => {
    const cd = $('#k-code').value.trim().toUpperCase(), v = num($('#k-val').value), type = $('#k-type').value;
    if(!/^[A-Z0-9_-]{2,20}$/.test(cd)) return toast('Kod 2–20 karakter; harf, rakam, - veya _ olmalı');
    if(!code && D.coupons.some(x => x.code === cd)) return toast('Bu kod zaten var');
    if(v <= 0 || (type === 'pct' && v > 100)) return toast('İndirim değeri geçersiz');
    Object.assign(c, {code: cd, type, value: v, min: num($('#k-min').value) || '', until: $('#k-until').value, on: $('#k-on').checked});

  };
  if(code) $('#k-del').onclick = () => { if(!confirm(`${code} silinsin mi?`)) return; D.coupons = D.coupons.filter(x => x.code !== code); save(); closeModal(); admCpn(); toast('Silindi'); };

function parseCfg(t){
  t = t.trim(); if(!t) return null;
  t = t.replace(/^[^{]*/, '').replace(/[^}]*$/, '');
  try{ return JSON.parse(t); }catch(e){}
  try{ return JSON.parse(t.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}')); }catch(e){ return undefined; }
}
function saveFb(){
  const c = parseCfg($('#fbCfg').value);
  if(c === undefined) return toast('firebaseConfig okunamadı');
  if(c && (!c.databaseURL || !c.apiKey)) return toast('databaseURL ve apiKey gerekli (Realtime Database oluşturduğunuzdan emin olun)');
  D.biz.fb = c; if(!c) delete D.biz.fb;
  try{ localStorage.setItem(LS_DRAFT, JSON.stringify(D)); }catch(e){ MEM[LS_DRAFT] = JSON.stringify(D); }

}
function clearFb(){ if(!confirm('Sunucu bağlantısı kaldırılsın mı? İndireceğiniz dosya yerel modda çalışır.')) return; delete D.biz.fb; try{ localStorage.setItem(LS_DRAFT, JSON.stringify(D)); }catch(e){} toast('Kaldırıldı'); setTimeout(() => location.reload(), 900); }
function copyTxt(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Kopyalandı'), () => toast('Kopyalanamadı, elle seçin')); }
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportHtml(){
  const out = clone(D); out.rev = Date.now().toString(36);
  if(out.biz.fb){ delete out.coupons; } /* sunucu modunda kupon kodları dosyada görünmesin */

function importJson(f){ if(!f) return; const r = new FileReader(); r.onload = () => { try{ const d = JSON.parse(r.result); if(!d.cats || !d.items || !d.biz) throw 0; const fb = D.biz.fb; D = d; if(fb) D.biz.fb = fb; normalize(); save(); renderAdmin(); toast('Yedek yüklendi'); }catch(e){ toast('Geçersiz yedek dosyası'); } }; r.readAsText(f); }

function bindImg(){
  const set = v => { const old = $('#f-img'); const n = v ? Object.assign(document.createElement('img'), {src: v}) : Object.assign(document.createElement('div'), {className:'noimg', textContent:'Görsel yok'}); n.id = 'f-img'; n.dataset.v = v; old.replaceWith(n); };

function readImg(file, max, cb, square){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    let sx = 0, sy = 0, sw = im.width, sh = im.height;
    if(square){ const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
    const k = Math.min(1, max / Math.max(sw, sh)), c = document.createElement('canvas');
    c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', .8));
  }; im.src = r.result; };
  r.readAsDataURL(file);
}

function runKitchen(){

  Store.watchOrders(list => {

    if(K.seen){ const nw = fresh.filter(o => !K.seen.has(o.id)); if(nw.length){ beep(); toast(`🔔 Yeni sipariş: #${nw.map(o => o.no).join(', #')}`); } }
    K.seen = new Set(list.map(o => o.id));

  });

let actx;
function beep(){
  if(!K.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime, comp = actx.createDynamicsCompressor(), master = actx.createGain();
    comp.threshold.value = -10; comp.ratio.value = 3; master.gain.value = 1.4;
    comp.connect(master).connect(actx.destination);
    /* kalın "ding-dong" zil: pes notalar + alt oktav, yumuşak sönümlü; 2 tur */
    const note = (at, f, len) => {
      [[f,'triangle',.55],[f/2,'sine',.45],[f*2,'sine',.08]].forEach(([fr,type,vol]) => {
        const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = fr;
        g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + .02);
        g.gain.exponentialRampToValueAtTime(.0001, at + len);
        o.connect(g).connect(comp); o.start(at); o.stop(at + len + .05);
      });
    };
    for(let r = 0; r < 2; r++){
      const b = t0 + r * 1.5;
      note(b, 392, 1.0);        /* Sol */
      note(b + .45, 311, 1.2);  /* Mi bemol – aşağı inen "dong" */
    }
    if(navigator.vibrate) navigator.vibrate([400,150,600]);
  }catch(e){}
}

      ${fin ? `<button onclick="kSet('${o.id}','new')">↺ Geri Al</button><button class="del" onclick="kDel(['${o.id}'],'#${esc(o.no)} silinsin mi?')">🗑 Sil</button>` : ''}
      <button class="ic" title="Yazdır" onclick="kPrint('${o.id}')">🖨️</button>
      ${o.status === 'new' || o.status === 'preparing' ? `<button class="ic x" title="İptal" onclick="if(confirm('#${esc(o.no)} iptal edilsin mi?'))kSet('${o.id}','cancelled')">✕</button>` : ''}
    </div>
  </div>`;
}
async function kDel(ids, msg){
  if(!ids.length) return toast('Silinecek sipariş yok');
  if(!confirm(msg + ' Bu işlem geri alınamaz.')) return;
  try{ await Store.remove(ids); toast(ids.length > 1 ? ids.length + ' sipariş silindi' : 'Sipariş silindi'); }catch(e){ toast('Silinemedi: ' + e.message); }
}
async function kSet(id, st){ try{ await Store.setStatus(id, st); }catch(e){ toast('Güncellenemedi: ' + e.message); } }
function kMenu(){
  KITCHEN = false; document.body.style.background = ''; $('#cartbar').style.display = '';
  STACK.length = 0; view = {page:'landing'}; render(); scrollTo(0,0);
}
function kLogout(){ if(!confirm('Mutfak ekranından çıkılsın mı?')) return; if(FBOK && auth.currentUser) auth.signOut(); LSdel(LS_KOK); location.reload(); }
function kPrint(id){
  const o = K.orders.find(x => x.id === id); if(!o) return;
  const a = o.address || {}, c = o.customer || {};
  const row = (l,v) => v ? `<tr><td>${l}</td><td>${esc(v)}</td></tr>` : '';
  const html = `<html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;width:72mm;margin:0 auto;font-size:12px}h1{font-size:16px;text-align:center;margin:6px 0}h2{font-size:22px;text-align:center;margin:4px 0}hr{border:0;border-top:1px dashed #000}table{width:100%;border-collapse:collapse}td{padding:2px 0;vertical-align:top}td:last-child{text-align:right}.n{border:1px solid #000;padding:6px;font-weight:bold;margin:6px 0}.a td:first-child{width:34%;font-weight:bold}.a td:last-child{text-align:left}</style></head><body>
    <h1>${esc(D.biz.name)}</h1><h2>#${esc(o.no)}</h2><div style="text-align:center">${new Date(o.createdAt).toLocaleString('tr-TR')}</div><hr>
    <table>${arr(o.items).map(l => `<tr><td>${l.qty}× ${esc(l.name)}${l.size ? ' (' + esc(l.size) + ')' : ''}</td><td>${money(l.line)}</td></tr>`).join('')}</table><hr>
    ${o.note ? `<div class="n">NOT: ${esc(o.note)}</div>` : ''}
    <table class="a">${row('Müşteri', c.name)}${row('Telefon', c.phone)}${row('Mahalle', a.mahalle)}${row('Cadde', a.cadde)}${row('Sokak', a.sokak)}${row('Bina No', a.bina)}${row('Kat', a.kat)}${row('Daire No', a.daire)}${row('Tarif', a.tarif)}</table><hr>
    <table>${row('Ara toplam', money(o.subtotal))}${o.discount ? row('Kupon ' + o.coupon, '-' + money(o.discount)) : ''}${o.deliveryFee ? row('Teslimat', money(o.deliveryFee)) : ''}<tr><td><b>TOPLAM</b></td><td><b>${money(o.total)}</b></td></tr></table>
    <p style="text-align:center;font-weight:bold">${esc(o.payment)}</p></body></html>`;
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0'; document.body.appendChild(f);
  f.onload = () => { try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('Yazdırma açılamadı'); } setTimeout(() => f.remove(), 3000); };
  f.srcdoc = html;
}

/* favicon: güncel logodan yuvarlak */
function setFavicon(){
  const src = D.biz.logo; if(!src) return;
  const im = new Image(); im.onload = () => { try{
    const n = 64, c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d');
    x.beginPath(); x.arc(n/2, n/2, n/2, 0, Math.PI*2); x.closePath(); x.clip();
    const s = Math.min(im.width, im.height); x.drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, n, n);
    $('#favIco').href = c.toDataURL('image/png');
  }catch(e){} }; im.src = src;
}
